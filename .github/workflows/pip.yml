name: "Pip"

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - develop
      - main

jobs:
  build:
    name: Build with Pip
    runs-on: ${{ matrix.platform }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.12"]
        include:
          - platform: ubuntu-latest
            container: ubuntu:24.04
          - platform: macos-latest
            container: null

    defaults:
      run:
        working-directory: vda5050_core/python

    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install native dependencies
      working-directory: .
      run: bash vda5050_core/python/scripts/install-native-deps.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: ${{ runner.os == 'macOS' && '14.0' || '' }}

    - name: Build and install
      env:
        CMAKE_PREFIX_PATH: ${{ runner.os == 'macOS' && '/opt/homebrew' || '/usr/local' }}
        MACOSX_DEPLOYMENT_TARGET: ${{ runner.os == 'macOS' && '14.0' || '' }}
      run: python -m pip install --verbose . --group test

    - name: Test
      working-directory: ${{ runner.temp }}
      env:
        DYLD_LIBRARY_PATH: /opt/homebrew/lib:/opt/homebrew/opt/openssl@3/lib
        LD_LIBRARY_PATH: /usr/local/lib:/usr/local/lib64
      run: |
        pytest "$GITHUB_WORKSPACE/vda5050_core/python/tests"
