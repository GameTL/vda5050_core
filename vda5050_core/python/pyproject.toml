[build-system]
requires = ["scikit-build-core>=0.11", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"


[project]
name = "vda5050"
version = "0.0.1"
license = "Apache-2.0"
description = "Python bindings for vda5050_core (client and RMF migration)"
readme = "README.md"
authors = [
  { name = "Game TL", email = "tinapatgl@a-star.edu.sg" },
]
requires-python = ">=3.10.*"
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "rich>=13.0.0",
]


[dependency-groups]
test = ["pytest>=8.0"]
dev = [{ include-group = "test" }]


[tool.scikit-build]
minimum-version = "build-system.requires"
wheel.packages = ["src/vda5050"]


[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["-ra", "--showlocals", "--strict-markers", "--strict-config"]
xfail_strict = true
log_level = "INFO"
filterwarnings = [
  "error",
  "ignore::pytest.PytestCacheWarning",
]
testpaths = ["tests"]


[tool.cibuildwheel]
build-frontend = "build[uv]"
build = "cp312-*"
test-command = "python -m pytest vda5050_core/python/tests"
test-sources = ["vda5050_core/python/pyproject.toml", "vda5050_core/python/tests"]
test-groups = ["test"]


[tool.ruff.lint]
extend-select = [
  "B",
  "I",
  "UP",
]
ignore = [
  "PLR09",
  "PLR2004",
]
isort.required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]
"examples/**" = ["T20"]
